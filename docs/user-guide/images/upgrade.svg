<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" role="img"><rect x="5" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="111" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">1 · 保存</text><text x="111" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">提交 + 回退点</text><text x="111" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">把修复保存在维护分支，建</text><text x="111" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">立 tag，并在仓库外另</text><text x="111" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">存备份。</text><path d="M220 105h9m-5-5 5 5-5 5" fill="none" stroke="#16765b" stroke-width="2"/><rect x="231" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="337" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">2 · 合并</text><text x="337" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">检查上游差异</text><text x="337" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">合并更新时保留修复和测试</text><text x="337" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">；WDA</text><text x="337" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">版本变化时重新适配补丁。</text><path d="M446 105h9m-5-5 5 5-5 5" fill="none" stroke="#16765b" stroke-width="2"/><rect x="457" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="563" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">3 · 测试</text><text x="563" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">通过后才安装</text><text x="563" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">检查网络限制、暂停阻断和</text><text x="563" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">界面；运行代码改变时使用</text><text x="563" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">新版本号。</text><path d="M672 105h9m-5-5 5 5-5 5" fill="none" stroke="#16765b" stroke-width="2"/><rect x="683" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="789" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">4 · 验收</text><text x="789" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">重连 + 真机核对</text><text x="789" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">核对加载版本、网络监听和</text><text x="789" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">暂停恢复。本人确认仍由你</text><text x="789" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">完成。</text></svg>
