<svg role="img" aria-labelledby="screen-title screen-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"><title id="screen-title">手机侧边栏和三个底部按钮</title><desc id="screen-desc">Live 表示预览正在更新。可以点击画面和拖动。底部从左到右依次是刷新连接、回到主屏幕、截图到 Mac 剪贴板。此图为示意，不是真实截图。</desc>
<rect x="318" y="8" width="264" height="379" rx="24" fill="#183129"/><rect x="335" y="46" width="230" height="284" rx="14" fill="#f0f5ee"/><text x="450" y="34" fill="white" font-size="13" text-anchor="middle" font-family="sans-serif">iPhone　 <tspan fill="#73deac">● Live</tspan></text>
<rect x="354" y="75" width="190" height="40" rx="8" fill="white"/><text x="371" y="101" font-size="15" fill="#183129" font-family="sans-serif">手机当前页面</text>
<rect x="354" y="130" width="190" height="45" rx="8" fill="white"/><circle cx="377" cy="152" r="10" fill="#b4d9c3"/><path d="M402 148H521M402 157H488" stroke="#c1cec4" stroke-width="4" stroke-linecap="round"/>
<rect x="354" y="188" width="190" height="45" rx="8" fill="white"/><circle cx="377" cy="210" r="10" fill="#b4d9c3"/><path d="M402 206H521M402 215H488" stroke="#c1cec4" stroke-width="4" stroke-linecap="round"/>
<circle cx="450" cy="278" r="20" fill="none" stroke="#16765b" stroke-width="2" stroke-dasharray="4 3"/><path d="M444 275l0 18 5-5 6 10 5-3-6-10 8-1Z" fill="#16765b"/>
<rect x="374" y="343" width="152" height="32" rx="16" fill="#365247"/><text x="400" y="366" fill="white" font-size="25" text-anchor="middle" font-family="sans-serif">↻</text><path d="M442 362v-9l8-7 8 7v9h-6v-6h-4v6Z" fill="none" stroke="white" stroke-width="1.6"/><rect x="491" y="349" width="16" height="13" rx="2" fill="none" stroke="white" stroke-width="1.6"/><circle cx="499" cy="355" r="3" fill="none" stroke="white" stroke-width="1.5"/>
<path d="M510 26H650" stroke="#16765b" stroke-width="1.8"/><circle cx="510" cy="26" r="4" fill="#16765b"/><text x="663" y="30" font-size="16" fill="#183129" font-weight="700" font-family="sans-serif">Live：预览正在更新</text><text x="663" y="55" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">任务是否完成，要看结果核对</text>
<path d="M470 278H650" stroke="#16765b" stroke-width="1.8"/><circle cx="470" cy="278" r="4" fill="#16765b"/><text x="663" y="272" font-size="16" fill="#183129" font-weight="700" font-family="sans-serif">点击 / 拖动</text><text x="663" y="299" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">你可以直接操作画面</text><text x="663" y="323" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">双指滑动可滚动或翻页</text>
<path d="M399 354H285V230H248" fill="none" stroke="#16765b" stroke-width="1.6"/><text x="55" y="220" font-size="16" fill="#183129" font-weight="700" font-family="sans-serif">① 刷新连接</text><text x="55" y="246" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">重连预览，不解除认证暂停</text>
<path d="M450 367V390H280" fill="none" stroke="#16765b" stroke-width="1.6"/><text x="55" y="375" font-size="16" fill="#183129" font-weight="700" font-family="sans-serif">② 回到主屏幕</text><text x="55" y="399" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">会改变手机当前页面</text>
<path d="M499 362H650" fill="none" stroke="#16765b" stroke-width="1.6"/><text x="663" y="361" font-size="16" fill="#183129" font-weight="700" font-family="sans-serif">③ 截图到剪贴板</text><text x="663" y="387" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">复制到 Mac 后，可自行粘贴</text>
</svg>
