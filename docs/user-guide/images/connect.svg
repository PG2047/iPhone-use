<path d="M332 113H573Q602 113 602 139V160Q602 179 635 179H650" fill="none" stroke="#6ca58b" stroke-width="6" stroke-linecap="round"/><rect x="426" y="77" width="105" height="35" rx="17" fill="#e8f4ee"/><text x="478" y="101" text-anchor="middle" font-size="16" fill="#16765b" font-weight="700" font-family="sans-serif">USB 数据线</text>
<rect x="651" y="13" width="134" height="201" rx="24" fill="#183129"/><rect x="660" y="23" width="116" height="180" rx="16" fill="#eff6f1"/><rect x="695" y="29" width="46" height="9" rx="5" fill="#183129"/><circle cx="718" cy="89" r="23" fill="#16765b"/><path d="M706 88l9 9 15-18" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/><text x="718" y="137" text-anchor="middle" class="diagram-label" font-weight="700" font-family="sans-serif" font-size="18" fill="#183129">iPhone</text><text x="718" y="165" text-anchor="middle" class="diagram-small" font-family="sans-serif" font-size="14" fill="#61736c">保持解锁</text>
</svg>
