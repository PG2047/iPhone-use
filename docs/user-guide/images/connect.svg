<svg role="img" aria-labelledby="connect-title connect-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235"><title id="connect-title">使用数据线连接 Mac 和已解锁的 iPhone</title><desc id="connect-desc">Mac 运行 Codex，经 USB 数据线连接 iPhone。保持手机解锁，在聊天里给出任务。</desc>
