<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" role="img"><rect x="5" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="111" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">1 · 找到备份</text><text x="111" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">bundle / 源码包</text><text x="111" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">bundle 保存</text><text x="111" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">Git 历史；源码压缩包</text><text x="111" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">保存文件快照。</text><path d="M220 105h9m-5-5 5 5-5 5" fill="none" stroke="#16765b" stroke-width="2"/><rect x="231" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="337" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">2 · 新目录</text><text x="337" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">克隆或解压</text><text x="337" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">核对提交、tag 和文件</text><text x="337" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">。保留当前工作，便于回退</text><text x="337" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">。</text><path d="M446 105h9m-5-5 5 5-5 5" fill="none" stroke="#16765b" stroke-width="2"/><rect x="457" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="563" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">3 · 安装</text><text x="563" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">复用已有配置</text><text x="563" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">运行安装脚本，使用你自己</text><text x="563" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">的设备、Team 与有效</text><text x="563" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">WDA 构建。</text><path d="M672 105h9m-5-5 5 5-5 5" fill="none" stroke="#16765b" stroke-width="2"/><rect x="683" y="10" width="212" height="200" rx="14" fill="#e8f4ee" stroke="#dbe4de"/><text x="789" y="39" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="400" fill="#16765b">4 · 复查</text><text x="789" y="73" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#183129">重连并验收</text><text x="789" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">核对版本、READY、回</text><text x="789" y="129" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">环监听和暂停保护，确认恢</text><text x="789" y="153" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#61736c">复完成。</text></svg>
