<svg role="img" aria-labelledby="xcode-title xcode-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215"><title id="xcode-title">Xcode 窗口可以关闭，后台服务和 USB 保持运行</title><desc id="xcode-desc">三个独立部分：Xcode 窗口可退出；后台 xcodebuild 与 USB 转发需保留；iPhone 保持 USB 连接和解锁。</desc>
<rect x="10" y="25" width="250" height="160" rx="18" fill="#f0f3f0" stroke="#dbe4de" stroke-width="2"/><text x="135" y="67" text-anchor="middle" font-size="21" fill="#183129" font-weight="700" font-family="sans-serif">Xcode 窗口</text><text x="135" y="107" text-anchor="middle" font-size="24" fill="#61736c" font-family="sans-serif">可以退出</text><text x="135" y="147" text-anchor="middle" font-size="16" fill="#61736c" font-family="sans-serif">保留完整 Xcode 安装</text>
<rect x="310" y="25" width="280" height="160" rx="18" fill="#e8f4ee" stroke="#16765b" stroke-width="2"/><text x="450" y="67" text-anchor="middle" font-size="21" fill="#183129" font-weight="700" font-family="sans-serif">后台服务</text><text x="450" y="107" text-anchor="middle" font-size="24" fill="#16765b" font-family="sans-serif">保持运行</text><text x="450" y="147" text-anchor="middle" font-size="16" fill="#61736c" font-family="sans-serif">xcodebuild + USB 转发</text>
<path d="M600 104H644M635 96L644 104L635 112" fill="none" stroke="#16765b" stroke-width="3"/>
<rect x="655" y="25" width="235" height="160" rx="18" fill="#e8f4ee" stroke="#16765b" stroke-width="2"/><text x="772" y="67" text-anchor="middle" font-size="21" fill="#183129" font-weight="700" font-family="sans-serif">iPhone</text><text x="772" y="107" text-anchor="middle" font-size="24" fill="#16765b" font-family="sans-serif">USB 连接</text><text x="772" y="147" text-anchor="middle" font-size="16" fill="#61736c" font-family="sans-serif">保持解锁，Mac 保持唤醒</text>
</svg>
